<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Raj AI Studio logo</title>
  <desc id="desc">Neon cyber-shield with terminal prompt and RAJ AI STUDIO typography</desc>
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF00FF"/>
      <stop offset="35%" stop-color="#0066FF"/>
      <stop offset="65%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#00FF66"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF1493"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#00FFFF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="92" fill="#060812"/>
  <rect x="10" y="10" width="492" height="492" rx="84" fill="none" stroke="#00FFFF" stroke-opacity=".3" stroke-width="2"/>
  <path d="M256 54 420 112v132c0 104-68 176-164 214-96-38-164-110-164-214V112z" fill="none" stroke="url(#shield)" stroke-width="10" filter="url(#glow)"/>
  <path d="M256 82 392 132v112c0 86-55 145-136 180-81-35-136-94-136-180V132z" fill="#0b1230" fill-opacity=".85" stroke="#FF00FF" stroke-opacity=".45" stroke-width="2"/>
  <rect x="150" y="170" width="212" height="136" rx="16" fill="#02040d" stroke="#00FFFF" stroke-opacity=".55" stroke-width="3"/>
  <path d="M170 200h34l18-22 22 44 20-36 18 14h56" fill="none" stroke="#00FF66" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M170 250h20m-20 28h44" stroke="#FF00FF" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <rect x="236" y="244" width="14" height="30" fill="#FFD700" filter="url(#glow)"/>
  <text x="256" y="360" fill="url(#text)" font-family="Segoe UI, Arial, sans-serif" font-size="45" font-weight="800" letter-spacing="4" text-anchor="middle">RAJ AI</text>
  <text x="256" y="402" fill="#8fa6c4" font-family="Consolas, monospace" font-size="22" letter-spacing="7" text-anchor="middle">STUDIO</text>
</svg>
