<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Raj AI Studio Banner</title>
  <desc id="desc">Futuristic cyberpunk banner for Raj AI Studio by Raj Gautam</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060812"/>
      <stop offset="50%" stop-color="#120a24"/>
      <stop offset="100%" stop-color="#05101e"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF00FF"/>
      <stop offset="20%" stop-color="#FF1493"/>
      <stop offset="40%" stop-color="#FFD700"/>
      <stop offset="60%" stop-color="#00FF66"/>
      <stop offset="80%" stop-color="#00FFFF"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <g stroke="#00FFFF" stroke-opacity="0.08">
    <path d="M0 50h1200M0 100h1200M0 150h1200M0 200h1200M0 250h1200"/>
    <path d="M60 0v300M120 0v300M180 0v300M240 0v300M300 0v300M360 0v300M420 0v300M480 0v300M540 0v300M600 0v300M660 0v300M720 0v300M780 0v300M840 0v300M900 0v300M960 0v300M1020 0v300M1080 0v300M1140 0v300"/>
  </g>
  <ellipse cx="980" cy="150" rx="220" ry="120" fill="#FF00FF" fill-opacity="0.07"/>
  <ellipse cx="220" cy="150" rx="180" ry="100" fill="#00FFFF" fill-opacity="0.06"/>
  <path d="M0 230C120 190 220 270 360 230S600 160 720 210s200 90 320 40 120-50 160-40v90H0z" fill="url(#wave)" fill-opacity="0.12"/>
  <path d="M0 236C120 196 220 276 360 236S600 166 720 216s200 90 320 40 120-50 160-40" fill="none" stroke="url(#wave)" stroke-width="2.5" filter="url(#glow)"/>

  <g transform="translate(86,52)">
    <path d="M70 0 134 24v52c0 44-28 76-64 92-36-16-64-48-64-92V24z" fill="#0b1230" stroke="url(#wave)" stroke-width="4" filter="url(#glow)"/>
    <path d="M34 58h12l8-10 9 18 9-15 7 7h27" fill="none" stroke="#00FF66" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38 80h10m-10 12h18" stroke="#FF00FF" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="70" y="77" width="6" height="14" fill="#FFD700"/>
  </g>

  <text x="250" y="118" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="2">RAJ <tspan fill="#00FFFF">AI</tspan> STUDIO</text>
  <text x="252" y="156" fill="url(#wave)" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" letter-spacing="1">Engineered by Raj Gautam • Open-Source AI Image Lab</text>
  <text x="252" y="190" fill="#8FA6C4" font-family="Consolas, monospace" font-size="16">Dual-Mode • Java + Python + JSON • Free Unlimited AI • GitHub Pages Ready</text>
  <g font-family="Consolas, monospace" font-size="13" fill="#E8F4FF">
    <rect x="252" y="210" width="132" height="30" rx="15" fill="#FF00FF" fill-opacity="0.15" stroke="#FF00FF" stroke-opacity="0.6"/><text x="274" y="230">FLUX REALISM</text>
    <rect x="394" y="210" width="112" height="30" rx="15" fill="#00FF66" fill-opacity="0.12" stroke="#00FF66" stroke-opacity="0.55"/><text x="414" y="230">NO API KEY</text>
    <rect x="516" y="210" width="92" height="30" rx="15" fill="#00FFFF" fill-opacity="0.12" stroke="#00FFFF" stroke-opacity="0.55"/><text x="535" y="230">MIT 2026</text>
  </g>
</svg>
